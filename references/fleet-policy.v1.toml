version = 1
owner = "skills-master"

[scope]
user_roots = ["~/.agents/skills", "~/.claude/skills", "~/.kimi-code/skills", "~/.codex/skills", "~/.gemini/skills", "~/.gemini/antigravity/skills"]
user_labels = ["user_agents", "user_claude", "user_kimi", "user_codex", "user_gemini", "user_antigravity"]
user_roles = ["user_canonical", "user_projection", "user_projection", "user_compat", "user_projection", "user_projection"]
system_roots = ["~/.codex/skills/.system"]
plugin_roots = ["~/.codex/plugins/cache"]
project_root = "~/Agents"
project_max_depth = 2
include_skills_master_repo = true
project_skill_roots = [".agents/skills", ".claude/skills", ".kimi-code/skills", ".codex/skills", "skills"]

[classification]
user_agents = "user_native_or_user_projection_source"
user_codex = "mixed_compatibility_surface"
user_codex_system = "host_managed_system"
project_codex = "legacy_compatibility_surface"
plugin_cache = "host_managed_plugin_cache"
cross_project_same_name = "legal_unless_shared_host_scope_or_declared_consumer_conflicts"
historical_default = "classify_before_excluding_or_deleting"

[content_audit]
skill_lock = "~/.agents/.skill-lock.json"
codex_native_allowed_frontmatter_keys = ["allowed-tools", "compatibility", "description", "license", "metadata", "name"]
locked_install_extensions_are_upstream_owned = true

[[frontmatter_contract]]
id = "hermes-native-v1"
repo = "~/Agents/hermes-muniu"
extensions = ["author", "category", "platforms", "prerequisites", "required_credential_files", "setup", "tags", "version"]
legacy_extensions = ["dependencies", "title", "triggers"]
authority = "~/Agents/hermes-muniu/AGENTS.md#skillmd-frontmatter; ~/Agents/hermes-muniu/tools/skills_tool.py"
disposition = "repo_product_contract"
legacy_disposition = "repo_cleanup_candidate_no_fleet_rewrite"

[[frontmatter_contract]]
id = "bo-chunxin-project-v1"
repo = "~/Agents/薄纯欣"
extensions = ["tags", "version"]
authority = "project-local Skill release metadata convention"
disposition = "project_local_contract_without_committed_repo_baseline"

