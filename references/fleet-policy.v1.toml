[guardrails]
read_only = true
follow_symlinks_for_writes = false
delete_assets = false
migrate_assets = false
adopt_candidates = false
global_name_uniqueness_required = false
one_editable_source_per_owner_scope = true
projection_must_be_one_hop = true

[historical]
exclude_path_fragments = ["/docs/dev-records/", "/evidence/", "/archive/", "/outputs/", "/snapshots/", "/node_modules/", "/.git/"]
candidate_name_markers = ["backup", "副本", ".wt-"]

