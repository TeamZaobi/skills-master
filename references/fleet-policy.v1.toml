[[hosts]]
name = "codex"
user_roots = ["user_agents", "user_codex"]
project_roots = ["project_agents", "project_codex"]
resolution = "parallel_or_host_defined"

[[hosts]]
name = "claude"
user_roots = ["user_claude"]
project_roots = ["project_claude"]
resolution = "single"

[[hosts]]
name = "kimi"
user_roots = ["user_kimi", "user_agents"]
project_roots = ["project_kimi", "project_agents"]
resolution = "ordered_precedence"

[[hosts]]
name = "gemini"
user_roots = ["user_gemini", "user_agents"]
project_roots = ["project_agents"]
resolution = "parallel_or_host_defined"

[[hosts]]
name = "antigravity"
user_roots = ["user_antigravity", "user_gemini", "user_agents"]
project_roots = ["project_agents"]
resolution = "parallel_or_host_defined"

[severity]
dangling_projection = "error"
projection_chain = "error"
projection_target_without_skill = "error"
parallel_host_collision = "error"
ordered_host_shadow = "warning"
real_directory_in_projection_surface = "warning"
package_in_discovery_surface = "warning"
non_skill_file_in_discovery_surface = "warning"
collection_root_in_discovery_surface = "warning"
non_skill_directory_in_discovery_surface = "warning"
legacy_project_codex_surface = "warning"
frontmatter_invalid_or_mismatched = "warning"
unregistered_or_legacy_source = "warning"
